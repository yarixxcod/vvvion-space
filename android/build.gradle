// Firebase (push) is optional: the google-services plugin is only put on the classpath when app/google-services.json exists.
buildscript {
    repositories { google(); mavenCentral() }
    dependencies {
        if (file('app/google-services.json').exists()) classpath 'com.google.gms:google-services:4.4.2'
    }
}
plugins { id 'com.android.application' version '8.11.1' apply false }
