name: Android hybrid APK

on:
  workflow_dispatch:
  push:
    branches: [uiux-polish-3.0.1]
    paths: ['android/**', 'src/**', 'public/**', 'scripts/**', 'package*.json', 'vite.config.ts', 'eslint.config.mjs', '.github/workflows/android-hybrid.yml']
  pull_request:
    branches: [uiux-polish-3.0.1]

permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    if: github.ref == 'refs/heads/uiux-polish-3.0.1' || github.base_ref == 'uiux-polish-3.0.1'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DATABASE_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Build and package web resources from this commit
        run: npm run build:web && npm run android:assets
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Configure optional Firebase and signing
        id: config
        env:
          VV_FIREBASE_JSON: ${{ secrets.VV_FIREBASE_JSON }}
          VV_KEYSTORE_B64: ${{ secrets.VV_KEYSTORE_B64 }}
          VV_STORE_PASS: ${{ secrets.VV_STORE_PASS }}
          VV_KEY_ALIAS: ${{ secrets.VV_KEY_ALIAS }}
          VV_KEY_PASS: ${{ secrets.VV_KEY_PASS }}
        shell: bash
        run: |
          umask 077
          if [[ -n "$VV_FIREBASE_JSON" ]]; then
            printf '%s' "$VV_FIREBASE_JSON" > android/app/google-services.json
          fi
          if [[ -n "$VV_KEYSTORE_B64" && -n "$VV_STORE_PASS" && -n "$VV_KEY_ALIAS" && -n "$VV_KEY_PASS" ]]; then
            printf '%s' "$VV_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/vvvion-release.keystore"
            echo 'signed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'signed=false' >> "$GITHUB_OUTPUT"
            echo 'Release signing is not configured; a debug APK will be available.'
          fi
      - name: Android tests, lint and debug APK
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verify release code and resource shrinking without publishing
        if: steps.config.outputs.signed != 'true'
        working-directory: android
        run: ./gradlew --no-daemon :app:assembleRelease
      - name: Build signed release APK and AAB
        if: steps.config.outputs.signed == 'true'
        working-directory: android
        env:
          VV_KEYSTORE: ${{ runner.temp }}/vvvion-release.keystore
          VV_STORE_PASS: ${{ secrets.VV_STORE_PASS }}
          VV_KEY_ALIAS: ${{ secrets.VV_KEY_ALIAS }}
          VV_KEY_PASS: ${{ secrets.VV_KEY_PASS }}
        run: ./gradlew --no-daemon :app:assembleRelease :app:bundleRelease
      - name: Name and verify installable APKs
        shell: bash
        env:
          SIGNED: ${{ steps.config.outputs.signed }}
        run: |
          VERSION=$(sed -n "s/.*versionName '\([^']*\)'.*/\1/p" android/app/build.gradle)
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/*.apk "artifacts/vvvion-space-${VERSION}-debug.apk"
          if [[ "$SIGNED" == true ]]; then
            cp android/app/build/outputs/apk/release/*.apk "artifacts/vvvion-space-${VERSION}-release.apk"
            cp android/app/build/outputs/bundle/release/*.aab "artifacts/vvvion-space-${VERSION}-release.aab"
          fi
          for apk in artifacts/*.apk; do
            "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          done
          sha256sum artifacts/* > artifacts/SHA256SUMS.txt
      - name: Upload APKs and checksums
        uses: actions/upload-artifact@v4
        with:
          name: vvvion-space-android-${{ github.run_number }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
      - name: Upload Android reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports-${{ github.run_number }}
          path: android/app/build/reports/
          if-no-files-found: ignore
      - name: Remove temporary secrets
        if: always()
        run: rm -f "$RUNNER_TEMP/vvvion-release.keystore" android/app/google-services.json

  emulator-smoke:
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: vvvion-space-android-${{ github.run_number }}
          path: artifacts
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch actual APK and verify lifecycle on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash scripts/android-emulator-smoke.sh
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-${{ github.run_number }}
          path: emulator-evidence/
          if-no-files-found: ignore
